<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
     <link rel="stylesheet" href="../CSS/event.css">
</head>
<body>

<h1>College Events</h1>

<div id="events"></div>

<script>
fetch("../JS/event.json")
.then(response => response.json())
.then(data =>
 {

    data.forEach(event =>
    {

        document.getElementById("events").innerHTML +="<h1>" + event.id + "</h1>" + 
        "<h2>" + event.name + "</h2>" +
        "<p>" + event.category + "</p>" +
        "<p>" + event.date + "</p>";

    });

});
</script>

</body>
</html>
